name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.1"
  GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Godot y plantillas de exportacion
        run: |
          mkdir -p "$HOME/godot-bin" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cd "$HOME/godot-bin"
          curl -fsSL -o godot.zip "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          unzip -q templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          ln -s "$HOME/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot-bin/godot"

      - name: Instalar Android SDK (build-tools 36.1.0, platform 36)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;36.1.0" "platforms;android-36" "cmdline-tools;latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Configurar Godot para Android
        run: |
          mkdir -p "$HOME/.config/godot" build
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          sed -i 's/^          //' "$HOME/.config/godot/editor_settings-4.7.tres"
          cat "$HOME/.config/godot/editor_settings-4.7.tres"

      - name: Importar proyecto
        run: |
          "$HOME/godot-bin/godot" --headless --path . --import || true
          "$HOME/godot-bin/godot" --headless --path . --import

      - name: Prueba automatica del juego
        run: |
          "$HOME/godot-bin/godot" --headless --fixed-fps 60 --path . --quit-after 4000 -- --autotest | tee autotest.log
          grep -q "AUTOTEST OK" autotest.log

      - name: Exportar APK
        run: |
          "$HOME/godot-bin/godot" --headless --verbose --path . --export-debug "Android" build/medu.apk 2>&1 | tee export.log
          ls -la build
          test -s build/medu.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medu-apk
          path: |
            build/medu.apk
            export.log

      - name: Publicar en Releases (enlace fijo de descarga)
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/medu.apk \
            --title "El ataque del medu (APK)" \
            --notes "APK para Android. Descargalo en el telefono e instalalo (permite 'origenes desconocidos')." \
            --target "$GITHUB_SHA"
